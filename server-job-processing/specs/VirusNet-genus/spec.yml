
name: VirusNet
description: Genus level prediction of viral sequences

expectedInputs:

- id: finput
  type: string[]
  name: FASTA file at the genome, contig or scaffold level.

execution:
  application: bash
  arguments:
  - run.sh
  - "${toFile(toJSON(inputs.finput))}"
  dependencies:
  - source: run.sh
    target: run.sh
  - source: ../../tools/reformat_json.py
    target: reformat_json.py

expectedOutputs:
- id: outputFile
  path: output/genus_output.csv
  name: Prediction output
  description: This file contains the probability for each FASTA entry of each sliding window
- id: outputFileSummary
  path: output/genus_summary_output.csv
  name: Summary of prediction output
  description: This file contains the probability for each FASTA entry
